name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/docs.yml"
      - "AGENTS.md"
      - "STATUS.md"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate-docs.mjs"
      - ".github/workflows/docs.yml"
      - "AGENTS.md"
      - "STATUS.md"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate docs tree
        run: node scripts/validate-docs.mjs
