  <text x="88" y="256" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="750" letter-spacing="-2.7" fill="#ffffff">Learn it. Build it.</text>
  <text x="88" y="329" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="750" letter-spacing="-2.7" fill="#ffffff" fill-opacity="0.42">Explain it back.</text>
  <text x="88" y="396" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" fill="#ffffff" fill-opacity="0.66">Interview practice becomes code, diagrams, decisions, explanations,</text>
  <text x="88" y="431" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" fill="#ffffff" fill-opacity="0.66">and understanding that survives the next review.</text>
